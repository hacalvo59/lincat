[package]
name = "lincat_panel"
version = "0.1.0"
edition = "2021"

# Panel CNC industrial LINCAT (UI Slint)
# Se comunica con el motor lincat_engine (Rust)
# Hugo Alberto Calvo

[dependencies]
slint = "1.3"

# Importar el motor LINCAT como librería
# Ajustá la ruta según tu workspace
lincat_engine = { path = "../lincat_engine" }

# Opcional: si usás logging
log = "0.4"
env_logger = "0.11"
