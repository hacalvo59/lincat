[package]
name = "lincat_engine"
version = "0.1.0"
edition = "2021"

# LINCAT Industrial Engine
# Motor geométrico + CNC + exportadores + simuladores
# Hugo Alberto Calvo

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Para cálculos geométricos, trigonometría, etc.
nalgebra = "0.32"

# Para multihilo (drivers, streaming, monitor)
crossbeam = "0.8"

# Para logs industriales
log = "0.4"
env_logger = "0.11"

# Para tiempos, delays, simulación CNC
chrono = "0.4"

# Para exportadores (si usás archivos)
thiserror = "1.0"

# Opcional: si querés usar traits de clonación inteligente
derive_more = "0.99"

# Opcional: si querés usar async en drivers reales
tokio = { version = "1.37", features = ["full"], optional = true }

[features]
default = []
async-drivers = ["tokio"]
